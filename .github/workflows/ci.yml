name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Supprime pywin32 du fichier requirements.txt juste avant l'installation sur Linux
          sed -i '/pywin32/d' requirements.txt
          pip install -r requirements.txt

      - name: Create dummy data for CI validation
        run: |
          mkdir -p data
          touch data/ventes.csv

      - name: Syntax check
        run: |
          python -m py_compile pipeline/ingest.py pipeline/validate.py pipeline/orchestrate.py
